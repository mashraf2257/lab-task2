name: Sequential Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  first-job:
    name: First Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          # Replace with your actual test command
          npm test

  second-job:
    name: Second Job
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Run deployment
        run: echo "First job succeeded, so this job can run."
