name: Sequential Workflow

on:
  push:
  pull_request:

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: echo "Tests passed successfully!"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Run second job
        run: echo "First job succeeded. Second job is running!"
